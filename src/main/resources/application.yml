spring:
  application:
    name: soulchat
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/soulchat
      auto-index-creation: true
    
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080

jwt:
  secret: your-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters-long
  expiration: 86400000

llm:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-3.5-turbo}

logging:
  level:
    com.talkingai.soulchat: DEBUG
    org.springframework.data.mongodb: DEBUG
